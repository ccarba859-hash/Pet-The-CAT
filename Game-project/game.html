<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kitty Petter Stimulator</title>

  <link href="style.css" rel="stylesheet" />
  <script defer src="script.js"></script>
</head>

<body>
  <div id="container" class="container">
    <h1>KITTY GAMBLING STIMULATOR</h1>

    <button class="button" id="play" onclick="Playgame()">
      Start Game
    </button>
  </div>

  <h2 class="time" id="demo">5:00</h2>

  <div class="game-layout">
    <div class="grid" id="grid"></div>

    <div class="mes" id="messages">
      <p class="start-message">Click Start Game to begin.</p>
    </div>
  </div>

  <audio autoplay loop id="whisp">
    <source src="whisp.mp3" type="audio/mpeg" />
  </audio>
</body>
</html>
